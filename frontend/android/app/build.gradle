apply plugin: 'com.android.application'

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.fisholg.desviaciones"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fisholg.desviaciones"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode y versionName los administra scripts/release-apk.js:
        // los sube automaticamente despues de cada build release exitoso.
        versionCode 4
        versionName "1.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


def enableAutoPublish = (findProperty('desviaciones.autoPublishRelease') ?: 'true').toBoolean()
def enableAutoBump = (findProperty('desviaciones.autoBumpVersionCode') ?: 'true').toBoolean()
def ejecutarRelease = { List<String> args ->
    try {
        def esWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def comando = esWindows
            ? (['cmd', '/c', 'node', 'scripts/release-apk.js'] + args)
            : (['node', 'scripts/release-apk.js'] + args)

        def pb = new ProcessBuilder(comando)
        pb.directory(new File(projectRoot))
        pb.redirectErrorStream(true)

        def proc = pb.start()
        proc.inputStream.eachLine { linea -> println linea }
        def codigo = proc.waitFor()

        if (codigo != 0) {
            println "[release-apk] EL SCRIPT TERMINÓ CON CÓDIGO ${codigo} (SE OMITE EL BUILD , SE OMITE LA PUBLICACIÓN Y EL VERSIONADO)."
        }
    } catch (Exception e) {
        println "[release-apk] NO SE PUDO EJECUTAR EL SCRIPT: ${e.message}"
    }
}

tasks.configureEach { task ->
    if (task.name == 'assembleRelease') {
        task.doLast {
            def apk = new File(projectRoot, "android/app/build/outputs/apk/release/app-release.apk")
            if (!apk.exists()) {
                println "[release-apk] NO SE ENCONTRO EL APK RELEASE, SE OMITE PUBLICACION/VERSIONADO."
                return
            }

            if (enableAutoPublish) {
                println "[release-apk] PUBLICANDO APK RELEASE..."
                ejecutarRelease(["--auto"])
            }

            if (enableAutoBump) {
                println "[release-apk] PREPARANDO SIGUIENTE VERSION..."
                ejecutarRelease(["--bump"])
            }
        }
    }
}
